name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    # configure-pages needs pages: write to read/create the Pages site.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: pip install -e ".[doc]"

      # The pages are notebooks; --execute runs their code so the results appear, and
      # --strict fails the build on any warning, such as a broken link.
      - name: Build documentation
        working-directory: docs
        env:
          BASE_URL: /natto
        run: jupyter-book build --html --execute --strict --ci

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type "workflow") if it isn't configured yet.
          enablement: true

  deploy:
    if: github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
