[build-system]
requires = ["setuptools >= 42", "versioningit >= 2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natto"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "monty",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = ["pre-commit>=2.19.0"]

[tool.pytest.ini_options]
# `pytest` runs the fast tests, `pytest -m full` runs everything, and
# `pytest -m slow` runs only what the default leaves out. The rank-six sectors
# and most of the rank-four classes are the expensive part; see
# `tests/test_mappings.DEFAULT_RANK_FOUR_CLASS`.
addopts = "-m 'not slow'"
markers = [
    "slow: seconds to minutes each, and excluded by the default run",
]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.1"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I"    # isort
]
fixable = ['I']
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# This duplicates the functionlity of ruff but it is nicer to have it for pycharm usage:
# ruff will move cursor to the bottom, while isort will not.
# Add src_paths so that import of current package will be placed at the bottom.
[tool.isort]
src_paths = ["src", "tests"]

[tool.black]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
